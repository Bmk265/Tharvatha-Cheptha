{% extends "base.html" %}
{% block content %}
<div class="card p-4 mx-auto mt-4" style="max-width: 410px;">
  <div class="text-center mb-3">
    <div class="d-inline-flex align-items-center justify-content-center mb-2">
      <svg width="42" height="42" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="loginLogoGrad" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#2563EB"/>
            <stop offset="100%" stop-color="#4F46E5"/>
          </linearGradient>
        </defs>
        <rect width="36" height="36" rx="11" fill="url(#loginLogoGrad)"/>
        <path d="M10 11.5C10 10.6716 10.6716 10 11.5 10H24.5C25.3284 10 26 10.6716 26 11.5V24.5C26 25.3284 25.3284 26 24.5 26H11.5C10.6716 26 10 25.3284 10 24.5V11.5Z" stroke="white" stroke-width="1.8"/>
        <path d="M14.5 10V26" stroke="white" stroke-width="1.8"/>
        <path d="M18 15H22.5M18 18.5H22.5M18 22H21" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </div>
    <h4 class="fw-bold mb-1">Sign in to TeamPool</h4>
    <p class="text-muted small mb-0">Enterprise Team Expense & Treasury Ledger</p>
  </div>
  <form method="POST">
    <div class="mb-3">
      <label class="form-label small fw-semibold">Email Address</label>
      <input type="email" name="email" class="form-control" placeholder="you@company.com" required>
    </div>
    <div class="mb-3">
      <label class="form-label small fw-semibold">Password</label>
      <input type="password" name="password" class="form-control" placeholder="••••••••" required>
    </div>
    <button class="btn btn-primary w-100 rounded-pill py-2 fw-semibold">Sign In</button>
  </form>
  <p class="mt-3 mb-0 text-center small text-muted">
    New to TeamPool? <a href="{{ url_for('register', next=request.args.get('next')) }}" class="fw-semibold text-decoration-none">Create an account</a>
  </p>
</div>
{% endblock %}
