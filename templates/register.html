{% extends "base.html" %}
{% block content %}
<div class="card p-4 mx-auto mt-4" style="max-width: 410px;">
  <div class="text-center mb-3">
    <span class="badge bg-primary bg-opacity-10 text-primary px-3 py-1 rounded-pill mb-2">TeamPool Treasury</span>
    <h4 class="fw-bold mb-1">Create Account</h4>
    <p class="text-muted small mb-0">Register first, then create a workspace or open a team invite link</p>
  </div>
  <form method="POST">
    <div class="mb-3">
      <label class="form-label small fw-semibold">Full Name</label>
      <input type="text" name="name" class="form-control" placeholder="Your full name" required>
    </div>
    <div class="mb-3">
      <label class="form-label small fw-semibold">Email Address</label>
      <input type="email" name="email" class="form-control" placeholder="you@company.com" required>
    </div>
    <div class="mb-3">
      <label class="form-label small fw-semibold">Password</label>
      <input type="password" name="password" class="form-control" placeholder="Create a strong password" required>
    </div>
    <button class="btn btn-primary w-100 rounded-pill py-2 fw-semibold">Create Account</button>
  </form>
  <p class="mt-3 mb-0 text-center small text-muted">
    Already registered? <a href="{{ url_for('login', next=request.args.get('next')) }}" class="fw-semibold text-decoration-none">Sign in</a>
  </p>
</div>
{% endblock %}
