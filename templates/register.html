{% extends "base.html" %}
{% block content %}
<div class="card p-4 mx-auto mt-4" style="max-width: 400px;">
  <h4 class="mb-3">Register</h4>
  <p class="text-muted small">First person to register automatically becomes the <strong>Cashier</strong>.</p>
  <form method="POST">
    <div class="mb-3">
      <label class="form-label">Full Name</label>
      <input type="text" name="name" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" name="email" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" name="password" class="form-control" required>
    </div>
    <button class="btn btn-success w-100">Create Account</button>
  </form>
  <p class="mt-3 mb-0 text-center small">Already registered? <a href="{{ url_for('login') }}">Login</a></p>
</div>
{% endblock %}
