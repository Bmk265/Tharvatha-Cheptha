{% extends "base.html" %}
{% block content %}
<div class="card p-4 mx-auto mt-3" style="max-width: 450px;">
  <h4 class="fw-bold mb-1">Create Account</h4>
  <p class="text-muted small mb-3">Start a new team (you become <strong>Cashier</strong>) or join an existing team with an invite code.</p>
  <form method="POST">
    <div class="mb-2">
      <label class="form-label small fw-semibold">Full Name</label>
      <input type="text" name="name" class="form-control" required>
    </div>
    <div class="mb-2">
      <label class="form-label small fw-semibold">Email</label>
      <input type="email" name="email" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label small fw-semibold">Password</label>
      <input type="password" name="password" class="form-control" required>
    </div>

    <div class="mb-2">
      <label class="form-label small fw-semibold">Team Setup</label>
      <select name="team_mode" id="teamModeSelect" class="form-select" onchange="toggleTeamFields()">
        <option value="create">Create a New Team (Become Cashier)</option>
        <option value="join">Join Existing Team with Invite Code</option>
      </select>
    </div>

    <div id="createTeamBox" class="bg-light p-3 rounded-3 mb-3">
      <div class="mb-2">
        <label class="form-label small fw-semibold">Team / Room Name</label>
        <input type="text" name="team_name" class="form-control form-control-sm" placeholder="e.g., Hyd Flat 302">
      </div>
      <div>
        <label class="form-label small fw-semibold">City (Optional)</label>
        <input type="text" name="team_city" class="form-control form-control-sm" placeholder="e.g., Hyderabad">
      </div>
    </div>

    <div id="joinTeamBox" class="bg-light p-3 rounded-3 mb-3 d-none">
      <label class="form-label small fw-semibold">Team Invite Code</label>
      <input type="text" name="invite_code" class="form-control form-control-sm text-uppercase" placeholder="e.g., HYDFL302">
    </div>

    <button class="btn btn-primary w-100 rounded-pill py-2 fw-semibold">Register</button>
  </form>
  <p class="mt-3 mb-0 text-center small text-muted">
    Already have an account? <a href="{{ url_for('login') }}" class="fw-semibold text-decoration-none">Login</a>
  </p>
</div>
{% endblock %}

{% block scripts %}
<script>
  function toggleTeamFields() {
    const mode = document.getElementById('teamModeSelect').value;
    document.getElementById('createTeamBox').classList.toggle('d-none', mode !== 'create');
    document.getElementById('joinTeamBox').classList.toggle('d-none', mode !== 'join');
  }
</script>
{% endblock %}
