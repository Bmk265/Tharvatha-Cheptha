{% extends "base.html" %}
{% block content %}
<div class="card p-4 mx-auto mt-4" style="max-width: 420px;">
  <div class="text-center mb-3">
    <span class="badge bg-primary bg-opacity-10 text-primary px-3 py-1 rounded-pill mb-2">Virtual Record System</span>
    <h4 class="fw-bold mb-1">Create Account</h4>
    <p class="text-muted small mb-0">Register first, then log in to create or join a team</p>
  </div>
  <form method="POST">
    <div class="mb-3">
      <label class="form-label small fw-semibold">Full Name</label>
      <input type="text" name="name" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label small fw-semibold">Email Address</label>
      <input type="email" name="email" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label small fw-semibold">Password</label>
      <input type="password" name="password" class="form-control" required>
    </div>
    <button class="btn btn-primary w-100 rounded-pill py-2 fw-semibold">Register</button>
  </form>
  <p class="mt-3 mb-0 text-center small text-muted">
    Already have an account? <a href="{{ url_for('login') }}" class="fw-semibold text-decoration-none">Login</a>
  </p>
</div>
{% endblock %}
