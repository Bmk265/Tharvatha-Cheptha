{% extends "base.html" %}
{% block content %}
<div class="card p-3 mb-3">
  <div class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-3">
    <h6 class="fw-bold mb-0"><i class="bi bi-chat-left-text me-1 text-primary"></i>{{ active_team.name }} Chat</h6>
    <span class="small text-muted">Team Only</span>
  </div>

  <div id="chatBox" style="height: 55vh; overflow-y: auto;" class="pe-1">
    {% for m in messages %}
      <div class="mb-2 p-2 px-3 rounded-4 {{ 'bg-primary text-white ms-auto' if m.user_id == current_user.id else 'bg-light' }}" style="max-width: 82%;">
        <div class="small fw-bold">{{ m.user.name }}</div>
        <div>{{ m.message }}</div>
        <div class="text-end" style="font-size: 0.68rem; opacity: 0.75;">{{ m.created_at.strftime('%d %b, %I:%M %p') }}</div>
      </div>
    {% else %}
      <p class="text-muted small text-center mt-4">No messages in this team yet.</p>
    {% endfor %}
  </div>
</div>

<form method="POST" class="d-flex gap-2">
  <input type="text" name="message" class="form-control rounded-pill" placeholder="Message {{ active_team.name }}..." required>
  <button class="btn btn-primary rounded-pill px-4">Send</button>
</form>
{% endblock %}

{% block scripts %}
<script>
  const chatBox = document.getElementById('chatBox');
  if (chatBox) chatBox.scrollTop = chatBox.scrollHeight;
</script>
{% endblock %}
