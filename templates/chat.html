{% extends "base.html" %}
{% block content %}
<div class="card p-3 mb-3" style="height: 62vh; overflow-y: auto;">
  <h6 class="fw-bold border-bottom pb-2">Local Team Chat</h6>
  {% for m in messages %}
  <div class="mb-2 p-2 rounded {{ 'bg-primary text-white ms-auto' if m.user_id == current_user.id else 'bg-light' }}" style="max-width: 80%;">
    <div class="small fw-bold">{{ m.user.name }}</div>
    <div>{{ m.message }}</div>
    <div class="text-end" style="font-size: 0.7rem; opacity: 0.8;">{{ m.created_at.strftime('%d %b, %I:%M %p') }}</div>
  </div>
  {% else %}
  <p class="text-muted small">No messages yet. Say hi to the room!</p>
  {% endfor %}
</div>

<form method="POST" class="d-flex gap-2">
  <input type="text" name="message" class="form-control" placeholder="Type message to team..." required>
  <button class="btn btn-primary">Send</button>
</form>
{% endblock %}
